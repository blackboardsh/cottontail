name: Published runtime bake baseline with pinned dependencies

on:
  push:
    branches: [diagnostics/macos-intel-firstparty]
    paths:
      - .github/workflows/diagnostic-firstparty-bake-baseline.yml

permissions:
  contents: read

jobs:
  baseline:
    name: Published .0 bake baseline (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --ignore-scripts
      - name: Restore pinned upstream fixture dependencies
        id: upstream-dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            compat/upstream/bun/v1.3.10/test/node_modules
            node_modules/.cache/cottontail-upstream-fixtures
          key: cottontail-bun-compat-dependencies-${{ runner.os }}-${{ runner.arch }}-v1-${{ hashFiles('compat/upstream/bun/v1.3.10/test/bun.lock', 'compat/upstream/bun/v1.3.10/test/package.json', 'compat/upstream/fixtures/duckdb-1.3.1.json') }}
      - name: Install missing pinned fixture dependencies
        if: steps.upstream-dependencies.outputs.cache-hit != 'true'
        run: |
          bun add react@18.3.1 --cwd=compat/upstream/bun/v1.3.10 --ignore-scripts
          bun install --cwd=compat/upstream/bun/v1.3.10/test --frozen-lockfile --ignore-scripts
      - name: Run unchanged bake baseline assertion
        env:
          COTTONTAIL_DIAGNOSTIC_ONLY_CASE: bake-dev-server
        shell: bash
        run: |
          mkdir -p diagnostic-logs
          set -o pipefail
          node scripts/diagnose-firstparty-baseline.mjs 2>&1 | tee diagnostic-logs/firstparty.log
      - name: Preserve full baseline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-baseline-bake-${{ matrix.platform }}
          path: diagnostic-logs/
          if-no-files-found: warn
          retention-days: 14
