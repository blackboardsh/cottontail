name: Diagnose canary9 Linux x64 compression
on:
  push:
    branches: [diagnostics/canary9-linux-x64-compression-20260913]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b396dc24ef7b636ddbd38540e43818f49e76480c
          path: runtime
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Install matching native build dependencies and GDB
        run: |
          sudo apt-get update
          sudo apt-get install -y clang g++ libbrotli-dev libffi-dev libssl-dev libzstd-dev zlib1g-dev gdb
      - name: Reuse the exact first diagnostic executable and symbols
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34745671151 --repo blackboardsh/cottontail --name canary9-linux-x64-compression-diagnostics --dir seed-runtime
          mkdir -p diagnostics runtime/zig-out
          tar -xzf seed-runtime/runtime-bin.tar.gz -C runtime/zig-out
          cp seed-runtime/cottontail.unstripped diagnostics/cottontail.unstripped
          cp seed-runtime/runtime-source-revision.txt seed-runtime/jsc-manifest.json seed-runtime/executable-sha256.txt diagnostics/
          (cd runtime && sha256sum -c ../diagnostics/executable-sha256.txt)
          git -C runtime rev-parse HEAD
      - name: Preserve first failure and collect GDB/cache/tier comparisons
        run: node scripts/diagnose-compression-x64.mjs runtime diagnostics
      - name: Retain native diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canary9-linux-x64-compression-diagnostics
          path: diagnostics
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
