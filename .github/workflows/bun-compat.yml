name: Bun compatibility

on:
  push:
    branches:
      - "compat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cottontail-bun-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun-compat:
    name: Complete Cottontail-owned Bun tier
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Check out Cottontail
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Validate compatibility workflow contract
        run: node --test scripts/bun-compat-workflow.test.js

      - name: Restore vendored toolchains
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vendors/zig
            vendors/jsc
            vendors/zig-html-rewriter
          key: cottontail-macos-arm64-v1-${{ hashFiles('scripts/zig-manifest.json', 'scripts/jsc-manifest.json', 'scripts/zig-html-rewriter-manifest.json') }}

      - name: Restore Bun compatibility dependencies
        id: bun-compat-dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            compat/upstream/bun/v1.3.10/test/node_modules
            node_modules/.cache/cottontail-upstream-fixtures
          key: cottontail-bun-compat-dependencies-${{ runner.os }}-${{ runner.arch }}-v1-${{ hashFiles('compat/upstream/bun/v1.3.10/test/bun.lock', 'compat/upstream/bun/v1.3.10/test/package.json', 'compat/upstream/fixtures/duckdb-1.3.1.json') }}

      - name: Set up Bun for frozen dependency restoration
        if: steps.bun-compat-dependencies.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Restore frozen Bun test dependencies
        if: steps.bun-compat-dependencies.outputs.cache-hit != 'true'
        run: bun install --cwd=compat/upstream/bun/v1.3.10/test --frozen-lockfile --ignore-scripts

      - name: Select Xcode 26.4
        run: |
          developer_dir=/Applications/Xcode_26.4.app/Contents/Developer
          test -d "$developer_dir"
          sudo xcode-select --switch "$developer_dir"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path

      - name: Install macOS build dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install libffi brotli
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3

      - name: Vendor Zig, HTML rewriter, and JavaScriptCore
        run: |
          node scripts/setup.js
          node scripts/setup-zig-html-rewriter.js
          node scripts/setup-jsc.js

      - name: Build Cottontail
        run: node scripts/zig.js build -Doptimize=ReleaseSmall -Dcpu=baseline

      - name: Build pinned Hutch compatibility engine
        id: hutch-engine
        run: |
          hutch_engine="$(node scripts/setup-upstream-hutch.js)"
          test -x "$hutch_engine"
          echo "binary=$hutch_engine" >> "$GITHUB_OUTPUT"

      - name: Run complete Cottontail-owned Bun compatibility tier
        run: node scripts/run-upstream-tests.js bun --include-expected-failures

      - name: Run Hutch-backed split bundler cases
        env:
          HUTCH_ENGINE: ${{ steps.hutch-engine.outputs.binary }}
        run: |
          node scripts/run-upstream-tests.js bun --hutch "$HUTCH_ENGINE" --test test/bundler/bundler_defer.test.ts --case '^\$file$' --expect-pass --jobs 1
          node scripts/run-upstream-tests.js bun --hutch "$HUTCH_ENGINE" --test test/bundler/bundler_npm.test.ts --case '^npm/ReactSSR$' --expect-pass --jobs 1
          node scripts/run-upstream-tests.js bun --hutch "$HUTCH_ENGINE" --test test/bundler/bundler_npm.test.ts --case '^npm/LodashES$' --expect-pass --jobs 1
