name: Intel opaque exec argv canary comparison
on:
  workflow_dispatch:
    inputs:
      canary4_run:
        type: string
        required: true
        default: '39626683620'
        description: Exact canary.4 release run containing Intel archive
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cottontail-release-macos-x64
          path: /tmp/cottontail-css-canary3
          run-id: 39615900708
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cottontail-release-macos-x64
          path: /tmp/cottontail-css-canary4
          run-id: ${{ inputs.canary4_run }}
          github-token: ${{ github.token }}
      - name: Compare unchanged isolated opaque argv case and capture child results
        shell: bash
        run: python3 scripts/diagnose-intel-exec-canaries.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: intel-canary3-canary4-opaque-exec-evidence
          path: /tmp/cottontail-intel-exec-evidence/
          if-no-files-found: error
