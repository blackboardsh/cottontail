name: Intel private-file stat diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  stat-diagnostic:
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Compare translated C and target-native stat bindings
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-macos-0.16.0.tar.xz -o /tmp/zig.tar.xz
          tar -xJf /tmp/zig.tar.xz -C /tmp
          mkdir private-stat-fixture
          chmod 700 private-stat-fixture
          /tmp/zig-x86_64-macos-0.16.0/zig build-exe scripts/diagnose-private-stat.zig -lc -O ReleaseFast -femit-bin=/tmp/private-stat-probe
          /usr/bin/stat -f 'filesystem uid=%u mode=%Lp inode=%i' private-stat-fixture
          /tmp/private-stat-probe
          nm -u /tmp/private-stat-probe | rg 'fstat|geteuid'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cottontail-release-macos-x64
          path: /tmp/final3-package
          run-id: 39615900708
          github-token: ${{ github.token }}
      - name: Reproduce exact canary.3 private-file rejection
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/final3-package/cottontail-v0.7.3-canary.3-macos-x64.tar.gz -C /tmp/final3-package
          binary=/tmp/final3-package/cottontail-v0.7.3-canary.3-macos-x64/bin/cottontail
          set +e
          AGENT=0 "$binary" test tests/js/hutch-shell-cli.test.ts -t 'runs one raw Bun shell program without changing its grammar'
          result=$?
          set -e
          echo "canary.3 raw shell fixture exit=$result"
