name: Bun compatibility

on:
  push:
    branches:
      - "compat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cottontail-bun-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun-compat:
    name: Complete Cottontail-owned Bun tier (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-26
            os: macos
          - platform: linux-x64
            runner: ubuntu-24.04
            os: linux
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
          - platform: windows-x64
            runner: windows-2025
            os: windows

    steps:
      - name: Check out Cottontail
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Validate compatibility runner contracts
        run: >-
          node --test
          scripts/bun-compat-workflow.test.js
          scripts/bun-status-platform.test.js
          scripts/import-upstream-tests.test.js
          scripts/review-bun-test-changes.test.js
          tests/upstream-status-accounting.test.mjs
          tests/upstream-runner.test.mjs

      - name: Validate platform-resolved Bun status accounting
        run: node scripts/check-bun-status.js

      - name: Set up Bun for repository dependencies
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install Cottontail development dependencies
        # First-party tests import the repo's own devDependencies (e.g.
        # lodash); fresh checkouts have no root node_modules.
        run: bun install --ignore-scripts

      - name: Restore vendored toolchains
        id: vendored-toolchains
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vendors/zig
            vendors/jsc
            vendors/zig-html-rewriter
            vendors/windows-deps
          key: cottontail-${{ matrix.platform }}-v1-${{ hashFiles('scripts/zig-manifest.json', 'scripts/jsc-manifest.json', 'scripts/zig-html-rewriter-manifest.json', 'vcpkg.json') }}

      - name: Restore Bun compatibility dependencies
        id: bun-compat-dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            compat/upstream/bun/v1.3.10/test/node_modules
            node_modules/.cache/cottontail-upstream-fixtures
          key: cottontail-bun-compat-dependencies-${{ runner.os }}-${{ runner.arch }}-v1-${{ hashFiles('compat/upstream/bun/v1.3.10/test/bun.lock', 'compat/upstream/bun/v1.3.10/test/package.json', 'compat/upstream/fixtures/duckdb-1.3.1.json') }}

      - name: Set up Bun for frozen dependency restoration
        if: steps.bun-compat-dependencies.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Provision linked react package
        if: steps.bun-compat-dependencies.outputs.cache-hit != 'true'
        # test/package.json links react from file:../node_modules/react,
        # mirroring Bun's repo where a root install provides it. On a fresh
        # checkout that target does not exist, so provision it first.
        run: bun add react@18.3.1 --cwd=compat/upstream/bun/v1.3.10 --ignore-scripts

      - name: Restore frozen Bun test dependencies
        if: steps.bun-compat-dependencies.outputs.cache-hit != 'true'
        run: bun install --cwd=compat/upstream/bun/v1.3.10/test --frozen-lockfile --ignore-scripts

      - name: Save frozen Bun test dependencies
        if: steps.bun-compat-dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            compat/upstream/bun/v1.3.10/test/node_modules
            node_modules/.cache/cottontail-upstream-fixtures
          key: cottontail-bun-compat-dependencies-${{ runner.os }}-${{ runner.arch }}-v1-${{ hashFiles('compat/upstream/bun/v1.3.10/test/bun.lock', 'compat/upstream/bun/v1.3.10/test/package.json', 'compat/upstream/fixtures/duckdb-1.3.1.json') }}

      - name: Select Xcode 26.4
        if: matrix.os == 'macos'
        run: |
          developer_dir=/Applications/Xcode_26.4.app/Contents/Developer
          test -d "$developer_dir"
          sudo xcode-select --switch "$developer_dir"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path

      - name: Install macOS build dependencies
        if: matrix.os == 'macos'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install libffi brotli
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3

      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            g++ \
            libbrotli-dev \
            libffi-dev \
            libssl-dev \
            libzstd-dev \
            zlib1g-dev

      - name: Verify Windows build environment
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $nodeIdentity = node -p "process.versions.node + ' ' + process.platform + ' ' + process.arch"
          if ($LASTEXITCODE -ne 0 -or $nodeIdentity.Trim() -ne "24.18.0 win32 x64") {
            throw "Expected Node 24.18.0 win32 x64, got '$nodeIdentity'"
          }

      - name: Vendor Zig, HTML rewriter, and JavaScriptCore
        shell: bash
        run: |
          node scripts/setup.js
          node scripts/setup-zig-html-rewriter.js
          node scripts/setup-jsc.js

      - name: Save vendored toolchains
        if: steps.vendored-toolchains.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vendors/zig
            vendors/jsc
            vendors/zig-html-rewriter
            vendors/windows-deps
          key: cottontail-${{ matrix.platform }}-v1-${{ hashFiles('scripts/zig-manifest.json', 'scripts/jsc-manifest.json', 'scripts/zig-html-rewriter-manifest.json', 'vcpkg.json') }}

      - name: Run Zig tests
        shell: bash
        run: node scripts/zig.js build test

      - name: Build Cottontail
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            node scripts/zig.js build -Doptimize=ReleaseSmall -Dtarget=x86_64-windows-msvc -Dcpu=baseline
          else
            node scripts/zig.js build -Doptimize=ReleaseSmall -Dcpu=baseline
          fi

      - name: Run first-party JavaScript tests
        shell: bash
        run: node scripts/test-js.js

      - name: Restore pinned Hutch compatibility engine
        id: pinned-hutch
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cottontail-local-tools/upstream-hutch
          key: cottontail-bun-compat-hutch-${{ matrix.platform }}-v1-${{ hashFiles('compat/upstream/hutch.json', 'scripts/setup-upstream-hutch.js', 'scripts/zig-manifest.json') }}

      - name: Build pinned Hutch compatibility engine
        id: hutch-engine
        shell: bash
        run: |
          hutch_engine="$(node scripts/setup-upstream-hutch.js)"
          node -e 'const fs = require("node:fs"); const path = process.argv[1]; if (!fs.statSync(path).isFile()) process.exit(1)' "$hutch_engine"
          node -e 'require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `binary=${process.argv[1]}\n`)' "$hutch_engine"
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            hutch_job_launcher="$(node scripts/setup-upstream-hutch.js --job-launcher)"
            node -e 'const fs = require("node:fs"); const path = process.argv[1]; if (!fs.statSync(path).isFile()) process.exit(1)' "$hutch_job_launcher"
            node -e 'require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `job_launcher=${process.argv[1]}\n`)' "$hutch_job_launcher"
          fi

      - name: Save pinned Hutch compatibility engine
        if: steps.pinned-hutch.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cottontail-local-tools/upstream-hutch
          key: cottontail-bun-compat-hutch-${{ matrix.platform }}-v1-${{ hashFiles('compat/upstream/hutch.json', 'scripts/setup-upstream-hutch.js', 'scripts/zig-manifest.json') }}

      - name: Verify Windows Job Object lifecycle
        if: matrix.os == 'windows'
        env:
          COTTONTAIL_TEST_WINDOWS_JOB_LAUNCHER: ${{ steps.hutch-engine.outputs.job_launcher }}
        run: node --test scripts/windows-job-child.test.js

      - name: Run complete Cottontail-owned Bun compatibility tier
        env:
          HUTCH_ENGINE: ${{ steps.hutch-engine.outputs.binary }}
          HUTCH_JOB_LAUNCHER: ${{ steps.hutch-engine.outputs.job_launcher }}
        shell: bash
        run: |
          job_launcher_args=()
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            job_launcher_args=(--job-launcher "$HUTCH_JOB_LAUNCHER")
          fi
          node scripts/run-upstream-tests.js bun --hutch "$HUTCH_ENGINE" "${job_launcher_args[@]}"

      - name: Run Hutch-backed split bundler cases
        env:
          HUTCH_ENGINE: ${{ steps.hutch-engine.outputs.binary }}
          HUTCH_JOB_LAUNCHER: ${{ steps.hutch-engine.outputs.job_launcher }}
        shell: bash
        run: |
          job_launcher_args=()
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            job_launcher_args=(--job-launcher "$HUTCH_JOB_LAUNCHER")
          fi
          node scripts/run-upstream-tests.js bun --hutch "$HUTCH_ENGINE" "${job_launcher_args[@]}" --test test/bundler/bundler_defer.test.ts --case '^\$file$' --expect-pass --jobs 1
          node scripts/run-upstream-tests.js bun --hutch "$HUTCH_ENGINE" "${job_launcher_args[@]}" --test test/bundler/bundler_npm.test.ts --case '^npm/ReactSSR$' --expect-pass --jobs 1
          node scripts/run-upstream-tests.js bun --hutch "$HUTCH_ENGINE" "${job_launcher_args[@]}" --test test/bundler/bundler_npm.test.ts --case '^npm/LodashES$' --expect-pass --jobs 1
