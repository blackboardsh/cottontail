name: Linux ARM exact canary Express memory comparison
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.10'
      - name: Install repository dependencies
        run: bun install --ignore-scripts
      - name: Restore frozen dependencies
        id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        timeout-minutes: 5
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
        with:
          path: |
            compat/upstream/bun/v1.3.10/test/node_modules
            node_modules/.cache/cottontail-upstream-fixtures
          key: cottontail-bun-compat-dependencies-${{ runner.os }}-${{ runner.arch }}-v1-${{ hashFiles('compat/upstream/bun/v1.3.10/test/bun.lock', 'compat/upstream/bun/v1.3.10/test/package.json', 'compat/upstream/fixtures/duckdb-1.3.1.json') }}
      - name: Remove incomplete cache
        if: steps.deps.outcome != 'success'
        run: node -e 'for (const p of ["compat/upstream/bun/v1.3.10/test/node_modules", "node_modules/.cache/cottontail-upstream-fixtures"]) require("node:fs").rmSync(p, {recursive:true,force:true})'
      - name: Install frozen dependencies on cache miss
        if: steps.deps.outcome != 'success' || steps.deps.outputs.cache-hit != 'true'
        run: |
          bun add react@18.3.1 --cwd=compat/upstream/bun/v1.3.10 --ignore-scripts
          bun install --cwd=compat/upstream/bun/v1.3.10/test --frozen-lockfile --ignore-scripts
      - name: Install Linux native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libbrotli-dev libffi-dev libssl-dev libzstd-dev zlib1g-dev
      - name: Compile only owned command adapter with pinned Zig
        run: |
          node scripts/setup.js
          mkdir -p /tmp/cottontail-express-evidence
          vendors/zig/zig build-exe tests/upstream-command-adapter.zig -O ReleaseFast -mcpu=baseline -femit-bin=/tmp/cottontail-express-command
      - name: Download exact unpublished canary.3 CI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '12353812197'
          path: /tmp/cottontail-express-canary3
          run-id: '39615900708'
          github-token: ${{ github.token }}
          merge-multiple: true
      - name: Compare each exact runtime once on unchanged Express memory fixture
        run: python3 scripts/diagnose-linux-arm-express-memory.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: linux-arm-express-canary-comparison-evidence
          path: /tmp/cottontail-express-evidence/
          if-no-files-found: error
