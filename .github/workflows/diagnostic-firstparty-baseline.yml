name: Published Windows runtime baseline first-party discovery

on:
  push:
    branches: [diagnostics/macos-intel-windows-firstparty]
    paths:
      - scripts/diagnose-firstparty-baseline.mjs
      - scripts/diagnose-windows-fixture-setup.mjs

permissions:
  contents: read

jobs:
  baseline:
    name: Published .0 baseline (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
            arch: x64
            bun: 1.3.10
          - platform: windows-arm64
            runner: windows-11-arm
            arch: arm64
            bun: 1.4.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}
      - name: Install first-party fixture dependencies
        run: |
          bun install --ignore-scripts
          node -e "if (process.arch !== '${{ matrix.arch }}') throw new Error('Unexpected Node architecture')"
      - name: Vendor fixture compiler and standalone Windows helpers
        run: node scripts/diagnose-windows-fixture-setup.mjs
      - name: Discover all published baseline failures with original assertions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostic-logs | Out-Null
          node scripts/diagnose-firstparty-baseline.mjs 2>&1 | Tee-Object -FilePath diagnostic-logs/firstparty.log
          exit $LASTEXITCODE
      - name: Preserve full baseline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-baseline-firstparty-${{ matrix.platform }}
          path: diagnostic-logs/
          if-no-files-found: warn
          retention-days: 14
