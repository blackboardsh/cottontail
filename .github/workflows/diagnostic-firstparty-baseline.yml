name: Published runtime baseline first-party discovery

on:
  push:
    branches: [diagnostics/macos-intel-firstparty-full]

permissions:
  contents: read

jobs:
  baseline:
    name: Published .0 baseline (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - name: Install first-party fixture dependencies
        run: |
          bun install --ignore-scripts
          sudo apt-get update
          sudo apt-get install -y clang g++ libbrotli-dev libffi-dev libssl-dev libzstd-dev zlib1g-dev
      - name: Restore vendored fixture compiler
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendors/zig
          key: cottontail-baseline-diagnostic-zig-${{ matrix.platform }}-${{ hashFiles('scripts/zig-manifest.json') }}
          restore-keys: |
            cottontail-toolchains-${{ matrix.platform }}-v2-
      - name: Vendor fixture compiler without rebuilding runtime
        run: node scripts/setup.js
      - name: Discover all published baseline failures with original assertions
        shell: bash
        run: |
          mkdir -p diagnostic-logs
          set -o pipefail
          node scripts/diagnose-firstparty-baseline.mjs 2>&1 | tee diagnostic-logs/firstparty.log
      - name: Preserve full baseline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-baseline-firstparty-${{ matrix.platform }}
          path: diagnostic-logs/
          if-no-files-found: warn
          retention-days: 14
